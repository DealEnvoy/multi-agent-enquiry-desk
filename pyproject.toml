[project]
name = "enquiry-desk"
version = "0.1.0"
description = "Reference demo of a LangGraph multi-agent enquiry desk."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Isaac Adekunle" }]
keywords = ["langgraph", "agents", "demo"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["langgraph>=1.2.20,<1.3"]

[project.optional-dependencies]
live = ["anthropic>=0.40", "openai>=1.60"]
dev = ["pytest>=8"]

[project.scripts]
enquiry-desk = "enquiry_desk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
